<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poules sports de raquettes</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3f6;--card:#fff;--tx:#152838;--mut:#5f7182;--ac:#1868b7;--acx:#fff;--st:#c0392b;--bd:#dbe4ea;--gold:#f5b301;--ball:#cfe61c;--ballx:#1b2a05;--h1:#0d3f73;--h2:#1f8fd6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--card:#182530;--tx:#e7eef3;--mut:#8ea0af;--ac:#4fa3e3;--acx:#06131f;--st:#e5675a;--bd:#28353f;--ball:#d7e639;--ballx:#1b2a05;--h1:#0a2438;--h2:#0d3f73}}
:root[data-theme="dark"]{--bg:#0e161e;--card:#182530;--tx:#e7eef3;--mut:#8ea0af;--ac:#4fa3e3;--acx:#06131f;--st:#e5675a;--bd:#28353f;--ball:#d7e639;--ballx:#1b2a05;--h1:#0a2438;--h2:#0d3f73}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;
  background:
    radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--ball) 20%, transparent) 0, transparent 32%),
    radial-gradient(circle at 90% 6%, color-mix(in srgb, var(--h2) 16%, transparent) 0, transparent 30%),
    var(--bg)}
header{position:relative;overflow:hidden;padding:16px 16px 14px;border-radius:0 0 24px 24px;background:linear-gradient(135deg,var(--h2),var(--h1));box-shadow:0 4px 14px rgba(13,63,115,.25)}
header::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 9px, transparent 9px 20px);pointer-events:none}
header::before{content:"🎾";position:absolute;right:-6px;top:-10px;font-size:64px;opacity:.16;transform:rotate(-12deg)}
h1{font-size:20px;margin:0 0 6px;color:#fff;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.hback{background:none;border:0;color:#fff;font:inherit;font-weight:700;padding:0 0 10px;opacity:.9;position:relative}
nav{display:flex;gap:6px;position:relative}
nav button{flex:1;padding:10px 4px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;font:inherit;font-size:14px;font-weight:600}
nav button.on{background:#fff;color:var(--h1);border-color:#fff}
main{padding:14px 16px 60px;max-width:960px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--mut)}
.hint{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.b{padding:11px 16px;border:0;border-radius:10px;font:inherit;font-weight:700;background:var(--ac);color:var(--acx)}
.b.sec{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.b.del{background:var(--st);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
textarea{width:100%;min-height:130px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
input[type=text]{padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;flex:1;min-width:0}
.stu{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.stu.sel{border-color:var(--ac);border-width:2px;background:color-mix(in srgb, var(--ac) 10%, var(--card))}
.pmenu{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;margin:-4px 0 10px}
.pmenu button{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700}
.pmenu button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.pmenu button.sec{width:auto;padding:0 12px;color:var(--mut)}
.stu .nm{flex:1;font-weight:700;overflow-wrap:anywhere}
.badge{font-size:13px;font-weight:700;color:var(--mut);background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 10px}
.badge.set{color:var(--ballx);background:var(--ball);border-color:var(--ball)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{position:relative;background:var(--card);border:1px solid var(--bd);border-left:8px solid var(--pc,var(--ac));border-radius:14px;padding:12px 12px 12px 14px;text-align:left;font:inherit;color:var(--tx)}
.pcard .ico{position:absolute;right:10px;top:10px;font-size:20px;opacity:.55}
.pcard b{font-size:18px;display:block;margin-bottom:6px}
.pcard .cnt{color:var(--mut);font-size:13px;margin-bottom:6px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 0 0}
.chip.abs{text-decoration:line-through;opacity:.6}
.back{background:var(--gold);color:var(--ballx);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.folder{width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:10px}
.folder .cnt{color:var(--mut);font-weight:600;font-size:13px}
.folder .chev{margin-left:auto;color:var(--mut);font-weight:400}
.matchrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.matchrow:first-of-type{border-top:0}
.mp{flex:1;text-align:center;font-weight:700;overflow-wrap:anywhere}
.msc{width:52px;height:44px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:18px;font-weight:800;text-align:center}
.msc.filled{border-color:var(--ball);color:var(--tx);background:color-mix(in srgb, var(--ball) 30%, var(--card))}
.mscwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.bonuslbl{font-size:11px;color:var(--mut);font-weight:700;min-height:14px}
.resrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.resrow.top1{background:color-mix(in srgb, var(--gold) 16%, var(--card));border-color:var(--gold)}
.resrow.absentrow{opacity:.55}
.resrow .rk{width:22px;text-align:center;font-weight:800;color:var(--mut)}
.resrow .nm{flex:1;min-width:90px;font-weight:700;overflow-wrap:anywhere}
.resrow .stat{font-size:12px;color:var(--mut);flex-basis:100%;order:3}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows button{padding:4px 8px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:12px;font-weight:700;white-space:nowrap}
.arrows button:disabled{opacity:.3}
.vs{color:var(--mut);font-size:13px;font-weight:700}
.rlabel{font-size:13px;color:var(--mut);font-weight:700;margin:10px 0 2px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mut);font-weight:700}
td.nmc{text-align:left;font-weight:700;position:relative}
tr.top1 td{background:color-mix(in srgb, var(--gold) 16%, var(--card))}
.crownwrap{position:relative;display:inline-block;padding-top:16px}
.crown{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.pad{background:var(--card);border-radius:18px;padding:18px;width:280px;max-width:100%}
.pad .who{font-weight:700;margin-bottom:4px;text-align:center}
.pad .disp{font-size:38px;font-weight:800;text-align:center;padding:10px 0;min-height:52px;font-variant-numeric:tabular-nums}
.padgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.padgrid button{height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:20px;font-weight:700}
.padrow{display:flex;gap:8px}
.padrow .b{flex:1}
.classrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.classrow button.go{flex:1;background:none;border:0;text-align:left;font:inherit;color:var(--tx);padding:0}
.classrow .cn{font-weight:800;font-size:18px}
.classrow .cs{color:var(--mut);font-size:13px;margin-top:2px}
.x{background:none;border:0;color:var(--mut);font-size:13px;padding:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>🏓 Poules – sports de raquettes</h1>
<div id="subnav"></div>
</header>
<main>
<section id="home"></section>
<section id="reg" hidden></section>
<section id="poules" hidden></section>
<section id="res" hidden></section>
</main>
<div id="modal"></div>
<script>
const KEY='raquette-poules-v2';
let S={classes:[]};
try{
  const r2=localStorage.getItem(KEY);
  if(r2){S=JSON.parse(r2)}
  else{
    const r1=localStorage.getItem('raquette-poules-v1');
    if(r1){
      const old=JSON.parse(r1);
      const students=(old.students||[]).map(s=>({...s,absent:false}));
      S={classes:[{id:'c'+Date.now().toString(36),name:'Classe 1',numPoules:old.numPoules||4,students,scoresByDate:Object.keys(old.scores||{}).length?{[todayKey()]:old.scores}:{}}]};
    }
  }
}catch(e){}
S.classes=S.classes||[];
S.classes.forEach(c=>{
  if(!c.scoresByDate){c.scoresByDate=Object.keys(c.scores||{}).length?{[todayKey()]:c.scores}:{};}
  delete c.scores;
});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==='on')e.onclick=attrs[k];else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>{if(c!=null&&c!=='')e.append(c)});return e}
function todayKey(){return new Date().toISOString().slice(0,10)}
function dateLabelOf(key){return new Date(key+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
let view='home',currentClassId=null,selStudent=null,curPoule=null,pad=null,openFolders=new Set();
function curClass(){return S.classes.find(c=>c.id===currentClassId)}

function arm(btn,label,fn){let a=false;btn.onclick=()=>{if(!a){a=true;btn.textContent='Sûr ?';setTimeout(()=>{a=false;btn.textContent=label},3000);return}fn()}}

/* ---------- Accueil : choix de la classe ---------- */
function renderHome(){
  const el=$('#home');el.replaceChildren();
  if(!S.classes.length){el.append(h('p',{class:'hint'},'Ajoute une première classe ci-dessous.'))}
  S.classes.forEach(c=>{
    const nbEl=c.students.filter(s=>s.poule).length;
    const go=h('button',{class:'go',on:()=>{currentClassId=c.id;show('reg')}},
      h('div',{class:'cn'},c.name),h('div',{class:'cs'},c.students.length+' élève'+(c.students.length>1?'s':'')+' · '+nbEl+' affecté'+(nbEl>1?'s':'')+' en poule'));
    const del=h('button',{class:'x'},'✕');
    arm(del,'✕',()=>{S.classes=S.classes.filter(x=>x!==c);save();renderHome()});
    el.append(h('div',{class:'classrow'},go,del));
  });
  const inp=h('input',{type:'text',placeholder:'Nom de la nouvelle classe'});
  const add=()=>{
    const name=inp.value.trim();if(!name)return;
    const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,numPoules:4,students:[],scoresByDate:{}};
    S.classes.push(c);save();inp.value='';renderHome();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  el.append(h('div',{class:'row'},inp,h('button',{class:'b',on:add},'Ajouter')));
}

/* ---------- Sous-navigation dans une classe ---------- */
function renderSubnav(){
  const sn=$('#subnav');sn.replaceChildren();
  if(view==='home'){sn.hidden=true;return}
  sn.hidden=false;
  const C=curClass();
  sn.append(h('button',{class:'hback',on:()=>{currentClassId=null;curPoule=null;show('home')}},'← Classes · '+(C?C.name:'')));
  const nv=h('nav',{});
  [['reg','Réglages'],['poules','Poules'],['res','Résultats']].forEach(([v,l])=>nv.append(h('button',{class:view===v?'on':'',on:()=>show(v)},l)));
  sn.append(nv);
}

/* ---------- Réglages ---------- */
function renderReg(){
  const el=$('#reg');el.replaceChildren();
  const C=curClass();if(!C)return;

  const seg=h('div',{class:'seg'});
  for(let i=1;i<=8;i++){
    seg.append(h('button',{class:C.numPoules===i?'on':'',on:()=>{C.numPoules=i;C.students.forEach(s=>{if(s.poule>i){s.poule=null;s.absent=false}});save();renderReg()}},String(i)));
  }
  el.append(h('div',{class:'card'},h('h2',{},'Nombre de poules'),seg,h('p',{class:'hint'},'De 1 à 8 poules. Réduire ce nombre désaffecte les élèves des poules qui disparaissent.')));

  const ta=h('textarea',{placeholder:'Un prénom par ligne'});ta.value=C.students.map(s=>s.name).join('\n');
  const msg=h('p',{class:'hint'},'');
  const ok=h('button',{class:'b',on:()=>{
    const names=[...new Set(ta.value.split('\n').map(x=>x.trim()).filter(Boolean))];
    const old=C.students;
    C.students=names.map(n=>old.find(o=>o.name===n)||{id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,poule:null,absent:false});
    save();msg.textContent=names.length+' élèves enregistrés.';renderReg();
  }},'Enregistrer la liste');
  el.append(h('div',{class:'card'},h('h2',{},'Élèves'),h('p',{class:'hint'},'Un prénom par ligne. Les affectations déjà faites sont conservées pour les prénoms qui restent.'),ta,h('div',{class:'row'},ok),msg));

  const assign=h('div',{});
  if(!C.students.length){assign.append(h('p',{class:'hint'},'Ajoute d\u2019abord des élèves ci-dessus.'))}
  else{
    assign.append(h('p',{class:'hint'},'Touche un élève pour choisir sa poule juste en dessous.'));
    C.students.forEach(s=>{
      const open=selStudent===s.id;
      const row=h('div',{class:'stu'+(open?' sel':'')});
      row.onclick=()=>{selStudent=open?null:s.id;renderReg()};
      row.append(h('div',{class:'nm'},s.name),h('div',{class:'badge'+(s.poule?' set':'')},s.poule?('Poule '+s.poule):'Non affecté'));
      assign.append(row);
      if(open){
        const menu=h('div',{class:'pmenu'});
        for(let i=1;i<=C.numPoules;i++){
          const btn=h('button',{class:s.poule===i?'on':''},String(i));
          btn.onclick=ev=>{ev.stopPropagation();s.poule=i;selStudent=null;save();renderReg()};
          menu.append(btn);
        }
        const clr=h('button',{class:'sec'},'∅ aucune');
        clr.onclick=ev=>{ev.stopPropagation();s.poule=null;s.absent=false;selStudent=null;save();renderReg()};
        menu.append(clr);
        assign.append(menu);
      }
    });
  }
  el.append(h('div',{class:'card'},h('h2',{},'Affectation aux poules'),assign));
}

/* ---------- Génération des matchs (méthode du cercle, matchs alternés) ---------- */
function poulePlayers(C,k){return C.students.filter(s=>s.poule===k)}
function activePlayers(C,k){return poulePlayers(C,k).filter(s=>!s.absent)}
function circleSchedule(players){
  let arr=players.slice();
  if(arr.length%2===1)arr.push(null);
  const n=arr.length;
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i],b=arr[n-1-i];
      if(a&&b)pairs.push([a,b]);
    }
    rounds.push(pairs);
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  rounds.reverse();
  return rounds;
}
function genMatches(players){
  const rounds=circleSchedule(players);
  const mk=(p1,p2,extra)=>{
    const [a,b]=p1.id<p2.id?[p1,p2]:[p2,p1];
    return Object.assign({id:a.id+'_'+b.id+(extra.tour?('_r'+extra.tour):''),p1:a,p2:b},extra);
  };
  if(players.length===3){
    const m=[];
    [1,2].forEach(tour=>rounds.forEach(rp=>rp.forEach(([p1,p2])=>m.push(mk(p1,p2,{tour})))));
    return m;
  }
  const m=[];
  rounds.forEach((rp,idx)=>rp.forEach(([p1,p2])=>m.push(mk(p1,p2,{round:idx+1}))));
  return m;
}
function getScore(C,dateKey,mid){const day=C.scoresByDate[dateKey];return (day&&day[mid])||{a:null,b:null}}
const matchScore=v=>v%100;
const bonusOf=v=>Math.floor(v/100);
function winnerOf(C,dateKey,m){
  const sc=getScore(C,dateKey,m.id);if(sc.a==null||sc.b==null)return null;
  const ma=matchScore(sc.a),mb=matchScore(sc.b);
  if(ma===mb)return null;
  return ma>mb?m.p1.id:m.p2.id;
}
function ranking(C,dateKey,players,matches){
  const stats={};
  players.forEach(p=>stats[p.id]={p,wins:0,played:0,pf:0,pa:0,bonus:0});
  matches.forEach(m=>{
    const sc=getScore(C,dateKey,m.id);
    if(sc.a==null||sc.b==null)return;
    const ma=matchScore(sc.a),mb=matchScore(sc.b);
    stats[m.p1.id].played++;stats[m.p2.id].played++;
    stats[m.p1.id].pf+=ma;stats[m.p1.id].pa+=mb;
    stats[m.p2.id].pf+=mb;stats[m.p2.id].pa+=ma;
    stats[m.p1.id].bonus+=bonusOf(sc.a);stats[m.p2.id].bonus+=bonusOf(sc.b);
    const w=winnerOf(C,dateKey,m);
    if(w)stats[w].wins++;
  });
  Object.values(stats).forEach(s=>s.diff=s.pf-s.pa);
  const byWins={};
  Object.values(stats).forEach(s=>{(byWins[s.wins]=byWins[s.wins]||[]).push(s)});
  const winCounts=Object.keys(byWins).map(Number).sort((a,b)=>b-a);
  let out=[];
  winCounts.forEach(w=>{
    let grp=byWins[w];
    if(grp.length===2){
      const [a,b]=grp;
      const h2h=matches.filter(m=>(m.p1.id===a.p.id&&m.p2.id===b.p.id)||(m.p1.id===b.p.id&&m.p2.id===a.p.id));
      let aw=0,bw=0;
      h2h.forEach(m=>{const w2=winnerOf(C,dateKey,m);if(w2===a.p.id)aw++;else if(w2===b.p.id)bw++});
      if(aw!==bw)grp=aw>bw?[a,b]:[b,a];
      else grp=grp.slice().sort((x,y)=>y.diff-x.diff);
    } else if(grp.length>=3){
      grp=grp.slice().sort((x,y)=>y.diff-x.diff);
    }
    out=out.concat(grp);
  });
  return out;
}

/* ---------- Pavé numérique ---------- */
function openPad(matchId,side,label){pad={matchId,side,label,val:''};renderModal()}
function closePad(){pad=null;renderModal()}
function renderModal(){
  const m=$('#modal');m.replaceChildren();
  if(!pad)return;
  const disp=h('div',{class:'disp'},pad.val===''?'–':pad.val);
  const grid=h('div',{class:'padgrid'});
  ['1','2','3','4','5','6','7','8','9'].forEach(d=>grid.append(h('button',{on:()=>{pad.val=(pad.val+d).slice(0,3);renderModal()}},d)));
  grid.append(h('button',{on:()=>{pad.val='';renderModal()}},'C'));
  grid.append(h('button',{on:()=>{pad.val=(pad.val+'0').slice(0,3);renderModal()}},'0'));
  grid.append(h('button',{on:()=>{pad.val=pad.val.slice(0,-1);renderModal()}},'⌫'));
  const ok=h('button',{class:'b',on:()=>{
    const C=curClass();
    const day=C.scoresByDate[todayKey()]=C.scoresByDate[todayKey()]||{};
    const sc=day[pad.matchId]=day[pad.matchId]||{a:null,b:null};
    sc[pad.side]=pad.val===''?0:parseInt(pad.val,10);
    save();closePad();renderPoules();
  }},'Valider');
  const cancel=h('button',{class:'b sec',on:closePad},'Annuler');
  m.append(h('div',{class:'ovl',on:e=>{if(e.target===e.currentTarget)closePad()}},h('div',{class:'pad'},h('div',{class:'who'},pad.label),disp,grid,h('div',{class:'padrow'},cancel,ok))));
}

/* ---------- Page Poules ---------- */
function renderPoules(){
  const el=$('#poules');el.replaceChildren();
  const C=curClass();if(!C)return;
  if(curPoule==null){
    if(!C.students.some(s=>s.poule)){el.append(h('p',{class:'hint'},'Affecte d\u2019abord des élèves à des poules dans l\u2019onglet « Réglages ».'))}
    const PCOL=['#1868b7','#cfe61c','#e07b1a','#9c4dcc','#2ab7a9','#e5507a','#4a6cf7','#5aa33e'];
    const PICO=['🎾','🏸','🏓','🎾','🏸','🏓','🎾','🏸'];
    const g=h('div',{class:'pgrid'});
    for(let k=1;k<=C.numPoules;k++){
      const pl=poulePlayers(C,k);
      const act=pl.filter(s=>!s.absent).length,abs=pl.length-act;
      const card=h('button',{class:'pcard',style:'--pc:'+PCOL[(k-1)%PCOL.length],on:()=>{curPoule=k;renderPoules()}},
        h('span',{class:'ico'},PICO[(k-1)%PICO.length]),
        h('b',{},'Poule '+k),h('div',{class:'cnt'},act+' présent'+(act>1?'s':'')+(abs?' · '+abs+' absent'+(abs>1?'s':''):'')),
        ...pl.map(p=>h('span',{class:'chip'+(p.absent?' abs':'')},p.name)));
      g.append(card);
    }
    el.append(g);
    return;
  }
  const allPl=poulePlayers(C,curPoule);
  const players=activePlayers(C,curPoule);
  const back=h('button',{class:'back',on:()=>{curPoule=null;renderPoules()}},'← Retour aux poules');
  el.append(back,h('h2',{},'Poule '+curPoule));

  if(players.length<2){
    el.append(h('p',{class:'hint'},'Il faut au moins 2 joueurs présents dans cette poule pour générer des matchs.'));
  } else {
  const today=todayKey();
  const matches=genMatches(players);
  const card=h('div',{class:'card'});
  if(players.length===3){
    [1,2].forEach(tour=>{
      card.append(h('div',{class:'rlabel'},'Tour '+tour));
      matches.filter(m=>m.tour===tour).forEach(m=>card.append(matchRow(m)));
    });
    card.append(h('p',{class:'hint'},'3 joueurs présents : chaque duo se rencontre deux fois (2 tours), soit 6 matchs.'));
  } else {
    const maxRound=matches.length?Math.max(...matches.map(m=>m.round)):0;
    if(maxRound>1){
      for(let rd=1;rd<=maxRound;rd++){
        card.append(h('div',{class:'rlabel'},'Série '+rd));
        matches.filter(m=>m.round===rd).forEach(m=>card.append(matchRow(m)));
      }
    } else {
      matches.forEach(m=>card.append(matchRow(m)));
    }
    card.append(h('p',{class:'hint'},players.length+' joueurs présents : chaque duo se rencontre une fois, soit '+matches.length+' match'+(matches.length>1?'s':'')+'. Les matchs alternent entre les joueurs plutôt que de suivre un seul joueur à la fois.'));
  }
  el.append(card);

  const rk=ranking(C,today,players,matches);
  const rcard=h('div',{class:'card'});
  rcard.append(h('h2',{},'Classement du jour'));
  const played=matches.some(m=>{const sc=getScore(C,today,m.id);return sc.a!=null&&sc.b!=null});
  if(!played){rcard.append(h('p',{class:'hint'},'Le classement s\u2019affine au fur et à mesure que les scores sont saisis.'))}
  const tb=h('tbody');
  rk.forEach((s,i)=>{
    const tr=h('tr',{class:i===0?'top1':''});
    const nmc=h('td',{class:'nmc'});
    nmc.append(i===0?h('span',{class:'crownwrap'},h('span',{class:'crown'},'👑'),s.p.name):s.p.name);
    tr.append(h('td',{},String(i+1)),nmc,h('td',{},String(s.wins)),h('td',{},String(s.pf)),h('td',{},String(s.pa)),h('td',{},(s.diff>0?'+':'')+s.diff),h('td',{},String(s.bonus)));
    tb.append(tr);
  });
  rcard.append(h('table',{},h('thead',{},h('tr',{},h('th',{},'#'),h('th',{},'Joueur'),h('th',{},'V'),h('th',{},'Pts +'),h('th',{},'Pts -'),h('th',{},'Diff'),h('th',{},'Bonus'))),tb));
  rcard.append(h('p',{class:'hint'},'Score à 3 chiffres : les centaines comptent comme un bonus à part, entière ; les deux derniers chiffres sont le score du match (ex. 111 = score 11, bonus 1). Classement : nombre de victoires, puis confrontation directe en cas d\u2019égalité à deux, puis différence points marqués - points encaissés en cas d\u2019égalité à trois ou plus. Les scores comptent pour la journée du '+dateLabelOf(today)+'.'));
  el.append(rcard);
  }

  if(allPl.length){
    const roster=h('div',{class:'card'});
    roster.append(h('h2',{},'Joueurs de la poule'),h('p',{class:'hint'},'Marquer un élève absent le retire des matchs prévus sans le désaffecter de la poule ; ses résultats déjà saisis sont conservés.'));
    allPl.forEach(s=>{
      const nm=h('div',{class:'nm'},s.name+(s.absent?' (absent)':''));
      const tgl=h('button',{class:'b'+(s.absent?'':' sec'),on:()=>{s.absent=!s.absent;save();renderPoules()}},s.absent?'Remettre présent':'Marquer absent');
      roster.append(h('div',{class:'resrow'+(s.absent?' absentrow':'')},nm,tgl));
    });
    el.append(roster);
  }
}
function scoreLabel(v){if(v==null)return '';const bo=bonusOf(v);return bo?('score '+matchScore(v)+' · bonus '+bo):('score '+matchScore(v))}
function matchRow(m){
  const C=curClass();
  const sc=getScore(C,todayKey(),m.id);
  const ba=h('button',{class:'msc'+(sc.a!=null?' filled':''),on:()=>openPad(m.id,'a',m.p1.name)},sc.a!=null?String(sc.a):'–');
  const bb=h('button',{class:'msc'+(sc.b!=null?' filled':''),on:()=>openPad(m.id,'b',m.p2.name)},sc.b!=null?String(sc.b):'–');
  const wa=h('div',{class:'mscwrap'},ba,h('div',{class:'bonuslbl'},scoreLabel(sc.a)));
  const wb=h('div',{class:'mscwrap'},bb,h('div',{class:'bonuslbl'},scoreLabel(sc.b)));
  return h('div',{class:'matchrow'},h('div',{class:'mp'},m.p1.name),wa,h('div',{class:'vs'},'vs'),wb,h('div',{class:'mp'},m.p2.name));
}

/* ---------- Page Résultats ---------- */
function movePoule(studentId,newPoule){
  const C=curClass();
  const s=C.students.find(x=>x.id===studentId);
  if(!s||newPoule<1||newPoule>C.numPoules)return;
  s.poule=newPoule;save();renderRes();
}
function folderBtn(key,label,count){
  const open=openFolders.has(key);
  return h('button',{class:'folder',on:()=>{if(open)openFolders.delete(key);else openFolders.add(key);renderRes()}},
    h('span',{},'📁'),h('span',{},label),h('span',{class:'cnt'},count),h('span',{class:'chev'},open?'▾':'▸'));
}
function renderRes(){
  const el=$('#res');el.replaceChildren();
  const C=curClass();if(!C)return;
  const dateKeys=Object.keys(C.scoresByDate).filter(k=>Object.keys(C.scoresByDate[k]||{}).length).sort((a,b)=>b.localeCompare(a));
  if(!dateKeys.length){el.append(h('p',{class:'hint'},'Aucun résultat de situation de référence pour le moment.'));return}
  el.append(h('p',{class:'hint'},'Chaque dossier correspond à une journée où la situation de référence a été jouée. Les flèches font passer un joueur dans la poule supérieure ou inférieure (montée/descente), pour toutes les journées.'));
  dateKeys.forEach(dateKey=>{
    const fkey='r-'+dateKey;
    const poulesThatDay=[];
    for(let k=1;k<=C.numPoules;k++){
      const allPl=poulePlayers(C,k);
      if(!allPl.length)continue;
      const matches=genMatches(allPl);
      const rk=ranking(C,dateKey,allPl,matches).filter(s=>s.played>0);
      if(rk.length)poulesThatDay.push({k,rk});
    }
    if(!poulesThatDay.length)return;
    const totalPlayers=poulesThatDay.reduce((a,p)=>a+p.rk.length,0);
    el.append(folderBtn(fkey,dateLabelOf(dateKey),totalPlayers+' joueur'+(totalPlayers>1?'s':'')));
    if(!openFolders.has(fkey))return;
    poulesThatDay.forEach(({k,rk})=>{
      const card=h('div',{class:'card'});
      card.append(h('h2',{},'Poule '+k));
      rk.forEach((s,i)=>{
        const nm=h('div',{class:'nm'});
        nm.append(i===0?h('span',{class:'crownwrap'},h('span',{class:'crown'},'👑'),s.p.name):s.p.name);
        const up=h('button',{on:()=>movePoule(s.p.id,k-1)},'▲ Poule '+(k-1));if(k===1)up.disabled=true;
        const dn=h('button',{on:()=>movePoule(s.p.id,k+1)},'▼ Poule '+(k+1));if(k===C.numPoules)dn.disabled=true;
        card.append(h('div',{class:'resrow'+(i===0?' top1':'')},
          h('div',{class:'rk'},String(i+1)),nm,
          h('div',{class:'stat'},s.wins+' V · '+s.pf+'-'+s.pa+' ('+(s.diff>0?'+':'')+s.diff+') · bonus '+s.bonus),
          h('div',{class:'arrows'},up,dn)));
      });
      el.append(card);
    });
  });

  const actions=h('div',{class:'card'});
  actions.append(h('h2',{},'Actions'));
  const msg=h('p',{class:'hint'},'');
  const exp=h('button',{class:'b'},'Exporter les résultats');
  arm(exp,'Exporter les résultats',async()=>{
    const lines=['Date;Poule;Rang;Joueur;Victoires;Points marqués;Points encaissés;Différence;Bonus'];
    dateKeys.forEach(dateKey=>{
      for(let k=1;k<=C.numPoules;k++){
        const allPl=poulePlayers(C,k);if(!allPl.length)continue;
        const matches=genMatches(allPl);
        const rk=ranking(C,dateKey,allPl,matches).filter(s=>s.played>0);
        rk.forEach((s,i)=>lines.push([dateKey,k,i+1,s.p.name,s.wins,s.pf,s.pa,s.diff,s.bonus].join(';')));
      }
    });
    try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'resultats-poules-'+C.name.replace(/[^a-z0-9]+/gi,'-')+'.csv',data:'\ufeff'+lines.join('\n')});msg.textContent='Fichier enregistré.'}
    catch(e){if(e&&e.code==='declined')return;try{await navigator.clipboard.writeText(lines.join('\n'));msg.textContent='Copié dans le presse-papiers (à coller dans un tableur).'}catch(_){msg.textContent='Export indisponible sur cet appareil.'}}
  });
  const rst=h('button',{class:'b del'},'Remettre les scores à zéro');
  arm(rst,'Remettre les scores à zéro',()=>{C.scoresByDate={};save();msg.textContent='Scores remis à zéro.';renderRes()});
  actions.append(h('div',{class:'row'},exp,rst),msg,h('p',{class:'hint'},'La remise à zéro efface les scores de toutes les journées pour cette classe, mais conserve les élèves et leurs poules.'));
  el.append(actions);
}

/* ---------- Navigation ---------- */
function show(v){
  view=v;
  renderSubnav();
  ['home','reg','poules','res'].forEach(i=>$('#'+i).hidden=i!==v);
  ({home:renderHome,reg:renderReg,poules:renderPoules,res:renderRes})[v]();
}
show('home');
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
